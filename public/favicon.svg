<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#863bff"/>
      <stop offset="1" stop-color="#47bfff"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7e14ff"/>
      <stop offset="1" stop-color="#47bfff"/>
    </linearGradient>
  </defs>

  <!-- fondo -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- tarjeta blanca de la lista -->
  <rect x="122" y="82" width="268" height="216" rx="26" fill="#ffffff"/>

  <!-- fila 1 -->
  <rect x="152" y="118" width="34" height="34" rx="9" fill="#eef2ff"/>
  <path d="M160 135l7 8 14-16" stroke="url(#check)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="200" y="127" width="150" height="16" rx="8" fill="#dbe4f3"/>

  <!-- fila 2 -->
  <rect x="152" y="168" width="34" height="34" rx="9" fill="#eef2ff"/>
  <path d="M160 185l7 8 14-16" stroke="url(#check)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="200" y="177" width="118" height="16" rx="8" fill="#dbe4f3"/>

  <!-- fila 3 -->
  <rect x="152" y="218" width="34" height="34" rx="9" fill="#eef2ff"/>
  <path d="M160 235l7 8 14-16" stroke="url(#check)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="200" y="227" width="132" height="16" rx="8" fill="#dbe4f3"/>

  <!-- wordmark -->
  <text x="256" y="384" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="58" letter-spacing="2" fill="#ffffff">AULAPRO</text>
</svg>
