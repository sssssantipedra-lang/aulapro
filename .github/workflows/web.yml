name: Publicar la web

# Publica `web/sitio` en https://aulapro.app (Cloudflare Pages, proyecto
# `aulapro-app`) cada vez que llega a master un cambio de la web o de la app:
# la versión web de la app va dentro, en https://aulapro.app/app/ (se compila
# con `npm run build:web`), con la función que pasa la licencia a Lemon
# Squeezy (`web/funciones/`). También se puede lanzar a mano desde la pestaña
# "Actions".
#
# Un cambio en otra rama se publica en la copia de prueba,
# https://prueba.aulapro-app.pages.dev (la app, en /app/): ahí se prueba antes
# de llevarlo a master.
#
# Necesita el secreto CLOUDFLARE_API_TOKEN: un token de Cloudflare con el
# permiso "Cloudflare Pages: Edit" sobre la cuenta. Sin él, el workflow avisa
# y no publica nada.
on:
  push:
    paths:
      - 'web/sitio/**'
      - 'web/versionar.mjs'
      - 'web/idiomas.mjs'
      - 'web/comprobar.mjs'
      - 'web/app/**'
      - 'web/funciones/**'
      - 'src/**'
      - 'public/**'
      - 'electron/student.html'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web.yml'
  workflow_dispatch: {}

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 15cc637555cb2850a712cd9cf9dd60cf
    steps:
      - name: Falta el token de Cloudflare
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Falta el secreto CLOUDFLARE_API_TOKEN, así que la web no se ha publicado."

      - name: Descargar el código
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4

      - name: Node.js
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencias de la app
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci

      - name: Compilar la versión web de la app
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build:web

      - name: Portada en català e inglés (/ca y /en)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node web/idiomas.mjs web/sitio

      # Si la copia está rota (falta un archivo, un enlace, un idioma...), aquí se para y la web que está en
      # línea se queda como estaba. Es lo que impide que un cambio roto tire la web.
      - name: Comprobar que la web está entera
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node web/comprobar.mjs web/sitio

      - name: Sellar los archivos con su huella
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node web/versionar.mjs web/sitio

      # Después de sellar: la app lleva sus propias huellas en los nombres de archivo
      - name: La app dentro de la web, en /app/
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: cp -r dist-web web/sitio/app

      # Cloudflare busca las funciones en `functions/`, junto a donde se ejecuta wrangler
      - name: Publicar en Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          mkdir -p _pages && cp -r web/funciones _pages/functions
          cd _pages
          npx --yes wrangler@4 pages deploy ../web/sitio --project-name aulapro-app \
            --branch ${{ github.ref == 'refs/heads/master' && 'main' || 'prueba' }} --commit-dirty=true
