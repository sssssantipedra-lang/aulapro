name: Publicar la web en GitHub Pages

# Segunda copia de la web, en otro proveedor y en otras direcciones (las de GitHub, no las de Cloudflare):
# https://sssssantipedra-lang.github.io/aulapro/. Se actualiza sola con cada cambio de la web, igual que
# web.yml (Cloudflare Pages), pero cada una es independiente: si una publicación falla, la otra sigue.
# Si algún día aulapro.app apunta aquí o a Cloudflare es solo cuestión de los DNS (docs/WEB.md, 4c).
# No necesita ningún secreto.
on:
  push:
    branches: [master]
    paths:
      - 'web/sitio/**'
      - 'web/idiomas.mjs'
      - 'web/comprobar.mjs'
      - 'web/versionar.mjs'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Portada en català e inglés (/ca y /en)
        run: node web/idiomas.mjs web/sitio

      # Si la copia está rota, se para aquí y la web que está en línea se queda como estaba.
      - name: Comprobar que la web está entera
        run: node web/comprobar.mjs web/sitio

      - name: Sellar los archivos con su huella
        run: node web/versionar.mjs web/sitio

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Subir la copia
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/sitio

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
