name: Borrar artefactos

# De un solo uso (2-11-2026): borra todos los artefactos de Actions, que ocupaban unos 14 GB con el repositorio
# privado (el plan gratuito incluye 500 MB). Los dejaron los flujos de las apps nativas, ya fuera de master.
# Se quita del repositorio en cuanto ha corrido.
on:
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  borrar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Borrar todos los artefactos
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            -q '.artifacts[] | select(.expired == false) | "\(.id) \(.size_in_bytes) \(.name)"' > lista.txt
          echo "Artefactos: $(wc -l < lista.txt)"
          awk '{s+=$2} END {printf "Ocupan: %.2f GB\n", s/1e9}' lista.txt
          borrados=0
          while read -r id size name; do
            if gh api -X DELETE "repos/$REPO/actions/artifacts/$id" > /dev/null; then borrados=$((borrados+1)); else echo "No se pudo borrar $id ($name)"; fi
          done < lista.txt
          echo "Borrados: $borrados"
          echo "Quedan: $(gh api "repos/$REPO/actions/artifacts?per_page=1" -q '.total_count') (incluidos los ya caducados)"
