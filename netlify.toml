# aulapro.app en Netlify (desde el 29-10-2026, decisión del dueño), fuera de Cloudflare: durante
# los partidos de LaLiga los operadores españoles bloquean direcciones de Cloudflare y la web caía
# con ellas. Cloudflare sigue llevando el DNS (sin proxy, nube gris) y la copia de Cloudflare Pages
# (aulapro-app.pages.dev) queda de respaldo. Netlify construye esto solo desde GitHub: la web, la
# app en /app/ y las funciones de la licencia (web/netlify/, copia de web/funciones/ con el formato
# de Netlify). Si aulapro.app no responde, la app usa el respaldo (src/platform/servidores.ts).
[build]
  # Solo se construye `master` (decisión del dueño, 29-10-2026: cada rama y cada vista previa gastaban créditos).
  # Netlify se salta la construcción cuando esto sale con 0. La prueba de las demás ramas va a Cloudflare (web.yml).
  ignore = '[ "$BRANCH" != "master" ]'
  command = "npm ci && npm run build:web && node web/idiomas.mjs web/sitio && node web/comprobar.mjs web/sitio && node web/versionar.mjs web/sitio && cp -r dist-web web/sitio/app"
  publish = "web/sitio"
  functions = "web/netlify"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "no-cache"
    # La misma que en web/sitio/_headers (si cambia una, cambia la otra)
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://aulapro.app https://www.aulapro.app https://aulapro-app.pages.dev https://prueba.aulapro-app.pages.dev https://aulapro-respaldo.netlify.app https://www.googleapis.com https://generativelanguage.googleapis.com https://accounts.google.com; frame-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob: data: https:; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com; frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/app/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/calendario-escolar.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"
